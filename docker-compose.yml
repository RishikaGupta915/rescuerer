services:
  api:
    build: .
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    environment:
      RESCUE_EYE_API_KEY: ${RESCUE_EYE_API_KEY:-local-development-key}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./Ultralytics:/app/Ultralytics

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      RESCUE_EYE_API_KEY: ${RESCUE_EYE_API_KEY:-local-development-key}
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./Ultralytics:/app/Ultralytics

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: